<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>План недели</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col select-none">

    <!-- Шапка -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 sticky top-0 z-20">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
                    План недели
                </h1>
                <p id="currentMonthYear" class="text-[11px] text-slate-400 capitalize mt-0.5">Загрузка...</p>
            </div>
            <button onclick="jumpToToday()" class="text-xs bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 px-3 py-1.5 rounded-xl font-medium active:scale-95 transition">Сегодня</button>
        </div>
    </header>

    <!-- Лента дней недели -->
    <div class="bg-slate-900/40 border-b border-slate-800/60 py-2.5 sticky top-[53px] z-10 backdrop-blur-md">
        <div class="max-w-md mx-auto px-4 flex gap-2 overflow-x-auto" id="weekStrip"></div>
    </div>

    <!-- Основное содержимое -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col pb-24">
        
        <div class="flex justify-between items-center mb-3">
            <h2 id="activeDayTitle" class="text-sm font-semibold text-slate-300 capitalize">День</h2>
            <span id="taskCounter" class="text-[11px] bg-slate-900 border border-slate-800 px-2.5 py-0.5 rounded-lg text-slate-400 font-medium">0 задач</span>
        </div>

        <!-- Поле ввода -->
        <div class="flex gap-2 mb-4">
            <input type="text" id="taskInput" placeholder="Новая задача..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 transition shadow-inner">
            <button onclick="addTask()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 rounded-xl transition shadow-lg shadow-indigo-600/20 active:scale-95 flex items-center justify-center text-xl">+</button>
        </div>

        <!-- Список задач -->
        <div id="taskList" class="space-y-2.5 flex-1"></div>
    </main>

    <script>
        let selectedDate = new Date();
        let tasks = JSON.parse(localStorage.getItem('plan_nedeli_storage')) || {};

        function formatDateKey(date) {
            return date.toISOString().split('T')[0];
        }

        function getStartOfWeek(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function renderApp() {
            renderHeaderInfo();
            renderWeekStrip();
            renderTaskList();
        }

        function renderHeaderInfo() {
            const optionsMonth = { month: 'long', year: 'numeric' };
            document.getElementById('currentMonthYear').innerText = selectedDate.toLocaleDateString('ru-RU', optionsMonth);

            const optionsDay = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('activeDayTitle').innerText = selectedDate.toLocaleDateString('ru-RU', optionsDay);
        }

        function renderWeekStrip() {
            const strip = document.getElementById('weekStrip');
            strip.innerHTML = '';
            const startOfWeek = getStartOfWeek(selectedDate);
            
            for (let i = 0; i < 7; i++) {
                const currentDay = new Date(startOfWeek);
                currentDay.setDate(startOfWeek.getDate() + i);

                const isSelected = formatDateKey(currentDay) === formatDateKey(selectedDate);
                const isToday = formatDateKey(currentDay) === formatDateKey(new Date());

                const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
                const btn = document.createElement('button');
                btn.className = `flex flex-col items-center justify-center min-w-[46px] py-1.5 px-1 rounded-xl transition border active:scale-95 ${
                    isSelected 
                        ? 'bg-indigo-600 border-indigo-500 text-white shadow-md shadow-indigo-600/30' 
                        : isToday 
                            ? 'bg-slate-900 border-indigo-500/50 text-indigo-400' 
                            : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`;
                
                btn.innerHTML = `
                    <span class="text-[9px] font-semibold uppercase tracking-wider mb-0.5">${dayNames[i]}</span>
                    <span class="text-xs font-bold">${currentDay.getDate()}</span>
                `;

                btn.onclick = () => {
                    selectedDate = new Date(currentDay);
                    renderApp();
                };
                strip.appendChild(btn);
            }
        }

        function renderTaskList() {
            const taskList = document.getElementById('taskList');
            const key = formatDateKey(selectedDate);
            const dayTasks = tasks[key] || [];

            document.getElementById('taskCounter').innerText = `${dayTasks.length} задач`;

            if (dayTasks.length === 0) {
                taskList.innerHTML = `
                    <div class="text-center py-16 text-slate-600">
                        <p class="text-xs">На этот день задач нет</p>
                    </div>
                `;
                return;
            }

            taskList.innerHTML = dayTasks.map((task, index) => `
                <div class="flex items-center justify-between bg-slate-900/80 border border-slate-800/80 px-3.5 py-3 rounded-xl shadow-sm transition group">
                    <label class="flex items-center gap-3 cursor-pointer flex-1 mr-2">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${index})" class="w-4 h-4 rounded border-slate-700 text-indigo-600 focus:ring-indigo-500 bg-slate-800 cursor-pointer">
                        <span class="text-xs transition ${task.completed ? 'line-through text-slate-600' : 'text-slate-200'}">${escapeHtml(task.text)}</span>
                    </label>
                    <button onclick="deleteTask(${index})" class="text-slate-600 hover:text-red-400 p-1 transition opacity-60 group-hover:opacity-100">✕</button>
                </div>
            `).join('');
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;

            const key = formatDateKey(selectedDate);
            if (!tasks[key]) tasks[key] = [];

            tasks[key].push({ text, completed: false });
            saveAndRender();
            input.value = '';
        }

        function toggleTask(index) {
            const key = formatDateKey(selectedDate);
            tasks[key][index].completed = !tasks[key][index].completed;
            saveAndRender();
        }

        function deleteTask(index) {
            const key = formatDateKey(selectedDate);
            tasks[key].splice(index, 1);
            if (tasks[key].length === 0) delete tasks[key];
            saveAndRender();
        }

        function jumpToToday() {
            selectedDate = new Date();
            renderApp();
        }

        function saveAndRender() {
            localStorage.setItem('plan_nedeli_storage', JSON.stringify(tasks));
            renderTaskList();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.getElementById('taskInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addTask();
        });

        renderApp();
    </script>
</body>
</html>
