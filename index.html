<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>План недели</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Шапка -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-indigo-400">План недели</h1>
            <button onclick="setToday()" class="text-xs bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 px-3 py-1.5 rounded-full font-medium hover:bg-indigo-600/50 transition">Сегодня</button>
        </div>
    </header>

    <!-- Основное содержимое -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col">
        
        <!-- Навигация по датам -->
        <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 mb-6 shadow-md flex justify-between items-center">
            <button onclick="changeDay(-1)" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">❮</button>
            <div class="text-center">
                <div id="dateTitle" class="text-lg font-semibold text-white">Загрузка...</div>
                <div class="text-xs text-indigo-400 font-medium mt-0.5">100% Оффлайн хранилище</div>
            </div>
            <button onclick="changeDay(1)" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">❯</button>
        </div>

        <!-- Поле добавления задачи -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="taskInput" placeholder="Новая задача на этот день..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 transition">
            <button onclick="addTask()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 rounded-xl transition shadow-lg shadow-indigo-600/20">+</button>
        </div>

        <!-- Список задач -->
        <div id="taskList" class="space-y-3 flex-1">
            <!-- Сюда динамически добавляются задачи -->
        </div>
    </main>

    <!-- Подвал -->
    <footer class="text-center py-4 text-xs text-slate-600 border-t border-slate-900">
        План недели • Работает без интернета
    </footer>

    <script>
        let currentDate = new Date();
        let tasks = JSON.parse(localStorage.getItem('plan_nedeli_tasks')) || {};

        function getDateKey(date) {
            return date.toISOString().split('T')[0];
        }

        function render() {
            const dateTitle = document.getElementById('dateTitle');
            const taskList = document.getElementById('taskList');
            
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            dateTitle.innerText = currentDate.toLocaleDateString('ru-RU', options);

            const key = getDateKey(currentDate);
            const dayTasks = tasks[key] || [];

            if (dayTasks.length === 0) {
                taskList.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <p class="text-sm">На этот день задач пока нет</p>
                    </div>
                `;
                return;
            }

            taskList.innerHTML = dayTasks.map((task, index) => `
                <div class="flex items-center justify-between bg-slate-900/80 border border-slate-800/80 p-4 rounded-xl shadow-sm transition hover:border-slate-700">
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${index})" class="w-5 h-5 rounded border-slate-700 text-indigo-600 focus:ring-indigo-500 bg-slate-800">
                        <span class="text-sm ${task.completed ? 'line-through text-slate-500' : 'text-slate-200'}">${task.text}</span>
                    </label>
                    <button onclick="deleteTask(${index})" class="text-slate-500 hover:text-red-400 p-1 transition">✕</button>
                </div>
            `).join('');
        }

        function changeDay(direction) {
            currentDate.setDate(currentDate.getDate() + direction);
            render();
        }

        function setToday() {
            currentDate = new Date();
            render();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;

            const key = getDateKey(currentDate);
            if (!tasks[key]) tasks[key] = [];

            tasks[key].push({ text, completed: false });
            localStorage.setItem('plan_nedeli_tasks', JSON.stringify(tasks));
            
            input.value = '';
            render();
        }

        function toggleTask(index) {
            const key = getDateKey(currentDate);
            tasks[key][index].completed = !tasks[key][index].completed;
            localStorage.setItem('plan_nedeli_tasks', JSON.stringify(tasks));
            render();
        }

        function deleteTask(index) {
            const key = getDateKey(currentDate);
            tasks[key].splice(index, 1);
            localStorage.setItem('plan_nedeli_tasks', JSON.stringify(tasks));
            render();
        }

        document.getElementById('taskInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addTask();
        });

        render();
    </script>
</body>
</html>
